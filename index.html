      function setResultMessage(km, rate) {
        return `Адрес доставки находится за пределами МКАД, сумма доставки ${
          km * rate
        }руб за ${km}км.`;
      }
      function distSquared(pt1, pt2) {
        return (
          (pt1[0] - pt2[0]) * (pt1[0] - pt2[0]) +
          (pt1[1] - pt2[1]) * (pt1[1] - pt2[1])
        );
      }

      function closestPoint(point, poly) {
        let closestPoint = poly[0];
        let shortestDistance = distSquared(point, poly[0]);

        for (let i = 0; i < poly.length; i++) {
          let d = distSquared(point, poly[i]);
          if (d < shortestDistance) {
            closestPoint = poly[i];
            shortestDistance = d;
          }
        }
        return closestPoint;
      }

      function inPoly(point, poly) {
        const x = point[0],
          y = point[1];

        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          let xi = poly[i][0],
            yi = poly[i][1];
          let xj = poly[j][0],
            yj = poly[j][1];

          let intersect =
            yi > y != yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;

          if (intersect) {
            inside = !inside;
          }
        }

        return inside;
      }

      let myMap;
      ymaps.ready(init);
      function init() {
        myMap = new ymaps.Map("map", {
          // надо создать <div id="map" style="width:100%;height:300px;"></div> где-то в HTML
          center: [55.76, 37.64], // координаты центра
          zoom: 9, // мастаб
        });
      }

      function distance(point1, point2) {
        // если точки совпадают, то выходим из функции, возвращаем 0
        if (point1[0] == point2[0] && point1[1] == point2[1]) {
          return 0;
        } else {
          const radlat1 = (Math.PI * point1[0]) / 180;
          const radlat2 = (Math.PI * point2[0]) / 180;
          const theta = point1[1] - point2[1];
          const radtheta = (Math.PI * theta) / 180;
          let dist =
            Math.sin(radlat1) * Math.sin(radlat2) +
            Math.cos(radlat1) * Math.cos(radlat2) * Math.cos(radtheta);
          if (dist > 1) {
            dist = 1;
          }
          dist = Math.acos(dist);
          dist = (dist * 180) / Math.PI;
          dist = dist * 60 * 1.1515;
          // чтобы получить в км
          dist = dist * 1.609344;
          return dist;
        }
      }

      function showResultMessage(element, text) {
        element.innerHTML = text;
      }

      function handleDistansePrice() {
        const mkadClosest = closestPoint(point, mkadPoints);
        const mkadDistance = distance(point, mkadClosest);

        if (inPoly(point, mkadPoints)) {
          showResultMessage(result, IS_IN_MKAD);
          result.setAttribute("style", "color: #000");
        } else {
          myMap.geoObjects.removeAll();

          // создаём машрут
          const multiRoute = new ymaps.multiRouter.MultiRoute(
            {
              referencePoints: [point, mkadClosest], // точка А, точка Б(МКАД)
              params: { results: 1 },
            },
            {
              boundsAutoApply: true, // чтобы маршрут был виден целиком на карте
            }
          );

          myMap.geoObjects.add(multiRoute);
          // после того, как маршрут добавлен, вычислим его длину и выведем сообщение об этом
          multiRoute.model.events.add("requestsuccess", function () {
            const activeRoute = multiRoute.getActiveRoute();
            let distance = parseInt(
              activeRoute.properties.get("distance").text
            );

              showResultMessage(result, IS_TO_FAR);
              result.setAttribute("style", "color: #ff4a4a");
